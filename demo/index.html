<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helmgear Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="player">
        <div class="cover cover-placeholder" aria-hidden="true"></div>

        <h2>Now Playing</h2>
        <h3 id="title">Song Title</h3>
        <p id="artist">Artist Name</p>

        <audio id="audio"></audio>

        <div class="controls">
            <button class="control-btn prev" ><img src="skip.png"></button>
            <button class="control-btn play" ><img src="play.png"></button>
            <button class="control-btn next" ><img src="skip.png"></button>
        </div>

        <div class="progress-container">
            <input type="range" id="progress-bar" value="0">
        </div>

        <div class="volume">
            <i class="vol-icon">🔊</i>
            <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1">
        </div>
    </div>



</body>
</html>
