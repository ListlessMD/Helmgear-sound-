<div class = player>
    <img src = "images/cover.png" class="cover">
    <h2> Now Playing </h2>
    <h3 id="title">Song Title</h3>
    <p id="artist">Artist Name</p>

    <audio id="audio"></audio>

    <div class="controls">
        <button id="prev" class="⏮️">Prev</button>
        <button id="play" class="⏯️">Play</button>
        <button id="next" class="⏭️">Next</button>
    </div>

    <div class="progress-container">
        <input type="range" id="progress-bar" value="0">
    </div>

    <div class="volume">
        <i class="vol-icon">🔊</i>
        <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1">
    </div> 
</div>
